<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 55">
  <!-- Edificio -->
  <g fill="#6f7777">
    <rect x="10" y="10" width="32" height="35" rx="1"/>

    <!-- Puerta -->
    <rect x="21" y="31" width="10" height="14"
          fill="#f7f7f7" fill-opacity="1"/>

    <!-- Ventanas -->
    <rect x="16" y="15" width="4" height="4"
        fill ="#f7f7f7" fill-opacity="1"/>
    <rect x="24" y="15" width="4" height="4"
        fill ="#f7f7f7" fill-opacity="1"/>
    <rect x="32" y="15" width="4" height="4"
        fill ="#f7f7f7" fill-opacity="1"/>

    <rect x="16" y="23" width="4" height="4"
        fill ="#f7f7f7" fill-opacity="1"/>
    <rect x="24" y="23" width="4" height="4"
        fill ="#f7f7f7" fill-opacity="1"/>
    <rect x="32" y="23" width="4" height="4"
        fill ="#f7f7f7" fill-opacity="1"/>

  </g>

  <!-- Estrellas animadas -->
  <g fill="#6f7777">
    <polygon points="15,4 16,6 18,6 16.5,7.5 17,10 15,8.8 13,10 13.5,7.5 12,6 14,6">
      <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 15 7"
          to="360 15 7"
          dur="4s"
          repeatCount="indefinite"/>
    </polygon>

    <polygon points="26,2 27,4 29,4 27.5,5.5 28,8 26,6.8 24,8 24.5,5.5 23,4 25,4">
      <animate
          attributeName="opacity"
          values="1;0.3;1"
          dur="2s"
          repeatCount="indefinite"/>
    </polygon>

    <polygon points="37,4 38,6 40,6 38.5,7.5 39,10 37,8.8 35,10 35.5,7.5 34,6 36,6">
      <animateTransform
          attributeName="transform"
          type="rotate"
          from="360 37 7"
          to="0 37 7"
          dur="5s"
          repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Persona entrando -->
  <g fill="#6f7777">
    <circle cx="8" cy="38" r="2">
      <animate
          attributeName="cx"
          values="8;26"
          dur="3s"
          repeatCount="indefinite"/>
      <animate
          attributeName="opacity"
          values="1;1;0"
          dur="3s"
          repeatCount="indefinite"/>
    </circle>

    <rect x="7" y="40" width="2" height="5">
      <animate
          attributeName="x"
          values="7;25"
          dur="3s"
          repeatCount="indefinite"/>
      <animate
          attributeName="opacity"
          values="1;1;0"
          dur="3s"
          repeatCount="indefinite"/>
    </rect>
  </g>
</svg>