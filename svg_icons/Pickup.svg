<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Chart axis -->
    <path d="M8 36V12" />
    <path d="M8 36H34" />

    <!-- Growth line -->
    <polyline points="12,30 18,24 24,26 31,16" />

    <!-- Data points -->
    <circle cx="12" cy="30" r="1.5" fill="#FFFFFF"/>
    <circle cx="18" cy="24" r="1.5" fill="#FFFFFF"/>
    <circle cx="24" cy="26" r="1.5" fill="#FFFFFF"/>
    <circle cx="31" cy="16" r="1.5" fill="#FFFFFF"/>

    <!-- Magnifier -->
    <circle cx="33" cy="30" r="5"/>
    <line x1="36.5" y1="33.5" x2="41" y2="38"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>