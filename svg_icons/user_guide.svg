<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">

    <!-- libro izquierda -->
    <path d="M256 110
             C210 90 140 90 90 110
             L90 400
             C140 380 210 380 256 400">
      <animate attributeName="stroke-dashoffset"
               from="1200" to="0"
               dur="1.5s"
               fill="freeze"/>
    </path>

    <!-- libro derecha -->
    <path d="M256 110
             C302 90 372 90 422 110
             L422 400
             C372 380 302 380 256 400">
      <animate attributeName="stroke-dashoffset"
               from="1200" to="0"
               dur="1.5s"
               fill="freeze"/>
    </path>

    <!-- lomo central -->
    <line x1="256" y1="110" x2="256" y2="400">
      <animate attributeName="y2"
               from="110"
               to="400"
               dur="1.5s"
               fill="freeze"/>
    </line>

  </g>

  <!-- punto de la i -->
  <circle cx="325" cy="180" r="10" fill="#FFFFFF">
    <animate attributeName="r"
             from="0"
             to="10"
             dur="2s"
             begin="1s"
             fill="freeze"
             repeatCount="indefinite"
             />
  </circle>

  <!-- cuerpo de la i -->
  <rect x="315" y="210" width="20" height="90" rx="4" fill="#FFFFFF">
    <animate attributeName="height"
             from="0"
             to="90"
             dur="2s"
             begin="1.1s"
             fill="freeze"
             repeatCount="indefinite"
             />
  </rect>

</svg>