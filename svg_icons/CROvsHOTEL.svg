<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64"
     fill="none">

  <g stroke="#F1F5FF"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- CRO: auriculares -->
    <path d="M7 26V21a11 11 0 0 1 22 0v5"/>

    <rect x="6" y="24" width="6" height="11" rx="2"/>
    <rect x="24" y="24" width="6" height="11" rx="2"/>

    <!-- Hotel: edificio -->
    <path d="M39 37V17h19v20"/>
    <path d="M43 17v-6h11v6"/>
    <path d="M37 37h23"/>

    <!-- Ventanas -->
    <path d="M44 23h3 M51 23h3
             M44 29h3 M51 29h3"/>

    <!-- Flecha de comparación animada -->
    <g>
      <path d="M32 25h5m-2-2 2 2-2 2"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="-1 0;1 0;-1 0"
        dur="1.5s"
        repeatCount="indefinite"/>
    </g>

    <!-- Barras de reparto -->
    <rect x="6" y="45" width="24" height="7"
          rx="3" opacity="0.5"/>

    <rect x="35" y="45" width="24" height="7"
          rx="3" opacity="0.5"/>

  </g>

  <!-- Participación CRO -->
  <rect x="8" y="47" width="10" height="3"
        rx="1.5" fill="#FFFFFF">
    <animate
      attributeName="width"
      values="10;20;10"
      dur="2.8s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Participación Hotel -->
  <rect x="37" y="47" width="20" height="3"
        rx="1.5" fill="#FFFFFF">
    <animate
      attributeName="width"
      values="20;10;20"
      dur="2.8s"
      repeatCount="indefinite"/>
  </rect>

</svg>