<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <style>
    .outline{
      fill:none;
      stroke:#fff;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:500;
      stroke-dashoffset:500;
      animation:draw 3s infinite;
    }

    .detail{
      fill:none;
      stroke:#fff;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:120;
      stroke-dashoffset:120;
      animation:draw 3.3s infinite;
    }

    @keyframes draw{
      to{
        stroke-dashoffset:0;
      }
    }
  </style>

  <!-- Clipboard -->
  <rect class="outline" x="18" y="18" width="42" height="64" rx="3"/>

  <!-- Clip superior -->
  <path class="outline"
        d="M28 18
           V26
           Q28 30 32 30
           H46
           Q50 30 50 26
           V18"/>

  <circle class="detail" cx="39" cy="16" r="4"/>

  <!-- Gráfico barra -->
  <path class="detail" d="M24 46 H40"/>
  <path class="detail" d="M29 46 V38"/>
  <path class="detail" d="M35 46 V34"/>
  <path class="detail" d="M41 46 V37"/>

  <!-- Gráfico circular -->
  <circle class="detail" cx="33" cy="64" r="10"/>
  <path class="detail" d="M33 64 L40 57"/>
  <path class="detail" d="M33 64 V54"/>

  <!-- Calculadora -->
  <rect class="outline" x="45" y="42" width="34" height="44" rx="3"/>

  <!-- Pantalla -->
  <rect class="detail" x="51" y="48" width="22" height="8" rx="1"/>

  <!-- Botones -->
  <path class="detail" d="M53 63 H55"/>
  <path class="detail" d="M62 63 H64"/>
  <path class="detail" d="M71 63 H73"/>

  <path class="detail" d="M53 70 H55"/>
  <path class="detail" d="M62 70 H64"/>
  <path class="detail" d="M71 70 H73"/>

  <path class="detail" d="M53 77 H55"/>
  <path class="detail" d="M62 77 H64"/>
  <path class="detail" d="M71 77 H73"/>

</svg>