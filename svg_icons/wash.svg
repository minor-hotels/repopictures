    M560 170
    V220
    H610
  "
/>

<!-- Líneas del documento -->
<line class="icon" x1="470" y1="240" x2="530" y2="240"/>
<line class="icon" x1="470" y1="270" x2="550" y2="270"/>
<line class="icon" x1="470" y1="300" x2="550" y2="300"/>
<line class="icon" x1="470" y1="330" x2="530" y2="330"/>
<line class="icon" x1="470" y1="360" x2="530" y2="360"/>

<!-- Círculo con X -->
<circle
  class="icon"
  cx="590"
  cy="375"
  r="40"
/>

<line
  class="icon"
