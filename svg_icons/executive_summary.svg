<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">

    <!-- Marco dashboard -->
    <rect x="80" y="120" width="280" height="220" />

    <!-- Lista -->
    <line x1="100" y1="150" x2="200" y2="150" />
    <line x1="100" y1="170" x2="200" y2="170" />
    <line x1="100" y1="190" x2="200" y2="190" />

    <!-- Barras -->
    <rect x="100" y="260" width="30" height="0">
      <animate attributeName="height" from="0" to="60" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="320" to="260" dur="0.5s" fill="freeze"/>
    </rect>

    <rect x="140" y="240" width="30" height="0">
      <animate attributeName="height" from="0" to="80" dur="0.7s" fill="freeze"/>
      <animate attributeName="y" from="320" to="240" dur="0.7s" fill="freeze"/>
    </rect>

    <rect x="180" y="220" width="30" height="0">
      <animate attributeName="height" from="0" to="100" dur="0.9s" fill="freeze"/>
      <animate attributeName="y" from="320" to="220" dur="0.9s" fill="freeze"/>
    </rect>

    <!-- Línea de tendencia -->
    <path d="M220 250 L260 210 L300 230 L340 180"
          stroke-dasharray="300"
          stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset"
               from="300" to="0"
               dur="6s"
               repeatCount="indefinite"/>
    </path>

    <!-- Nodos -->
    <circle cx="220" cy="250" r="6">
      <animate attributeName="r" from="0" to="1" dur="1s" fill="freeze"/>
    </circle>
    <circle cx="260" cy="210" r="6">
      <animate attributeName="r" from="0" to="6" dur="3s" fill="freeze"/>
    </circle>
    <circle cx="300" cy="230" r="6">
      <animate attributeName="r" from="0" to="6" dur="3s" fill="freeze"/>
    </circle>
    <circle cx="340" cy="180" r="6">
      <animate attributeName="r" from="0" to="6" dur="4s" fill="freeze"/>
    </circle>

    <!-- Círculo exterior (tipo KPI) -->

    <circle cx="300" cy="290" r="40"
            stroke-dasharray="251"
            stroke-dashoffset="251">
      <animate attributeName="stroke-dashoffset"
               from="251" to="0"
               dur="5.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="300" cy="290" r="20"
            stroke-dasharray="125"
            stroke-dashoffset="125">
      <animate attributeName="stroke-dashoffset"
               from="125" to="0"
               dur="5.2s"
               repeatCount="indefinite"/>
    </circle>


  </g>
</svg>