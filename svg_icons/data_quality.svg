<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

<style>
.outline{
  fill:none;
  stroke:#fff;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:400;
  stroke-dashoffset:400;
  animation:draw 1.2s ease forwards;
}

.check{
  fill:none;
  stroke:#fff;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:80;
  stroke-dashoffset:80;
  animation:draw .6s ease forwards 1s;
}

@keyframes draw{
  to{
    stroke-dashoffset:0;
  }
}
</style>

<!-- Caja -->
<path class="outline"
      d="M10 90
         L10 26
         L20 16
         H40
         A10 10 0 0 0 60 16
         H80
         L90 26
         L90 90
         L10 90"/>

<!-- Línea horizontal superior -->
<path class="outline"
      d="M10 26 H90"/>

<!-- Check -->
<path class="check"
      d="M35 55 L48 68 L70 45"/>

</svg>