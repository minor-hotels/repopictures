<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">

  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="1.4"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Ejes -->
    <path d="M8 36V12"/>
    <path d="M8 36H34"/>

    <!-- Línea de pickup animada -->
    <path d="M12 30 L18 24 L24 26 L31 16"
          stroke-dasharray="30"
          stroke-dashoffset="30">
      <animate
          attributeName="stroke-dashoffset"
          from="30"
          to="0"
          dur="1.8s"
          repeatCount="indefinite"/>
    </path>

    <!-- Puntos -->
    <circle cx="12" cy="30" r="1.1" fill="#FFFFFF"/>
    <circle cx="18" cy="24" r="1.1" fill="#FFFFFF"/>
    <circle cx="24" cy="26" r="1.1" fill="#FFFFFF"/>
    <circle cx="31" cy="16" r="1.1" fill="#FFFFFF"/>

    <!-- Lupa -->
    <circle cx="33" cy="30" r="4"/>
    <line x1="35.8" y1="32.8" x2="39.5" y2="36.5"/>

  </g>

</svg>